<title>სანდროს დაბადების დღე</title>

<style>
html,body{margin:0}
img{max-width:100%}

/* Layout: one-screen night stadium. The camera follows Sandro up the pitch past three defenders to the goal; scoreboard and commentary on top, the details appear painted on the pitch after the goal. Single dark look by choice. */
:root{
  color-scheme:dark;
  --night:#0A1330;
  --white:#FFFFFF;
  --red:#E0152A;
  --gold:#FFC93C;
  --ink:#0E1838;
  --ink-soft:#56607F;
  --line:#E3E7F0;
  --font:"Noto Sans Georgian","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--white);font-family:var(--font);overflow:hidden}
.stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#1F8F4E}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flash{position:absolute;inset:0;background:var(--white);opacity:0;pointer-events:none}
.goal .flash{animation:flash .6s ease-out}
.shake .scene{animation:shake .55s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}45%{transform:translate(-5px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}

/* top HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.score{display:flex;align-items:stretch;border-radius:8px;overflow:hidden;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.score span{padding:6px 12px;background:var(--white);color:var(--ink)}
.score .num{background:var(--red);color:var(--white);font-size:18px;font-weight:900;min-width:40px;text-align:center;font-variant-numeric:tabular-nums;padding:4px 10px}
.score .num.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.cap{margin:0;font-weight:900;font-size:20px;background:rgba(10,19,48,.82);color:var(--gold);padding:6px 16px;border-radius:999px}
.cap:empty{display:none}
.cap.pop{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.shout{margin:0;font-weight:900;font-size:clamp(44px,15vw,70px);line-height:1;color:var(--gold);
  text-shadow:0 3px 0 #B7791A,0 8px 24px rgba(0,0,0,.5);opacity:0;transform:scale(.3) rotate(-6deg)}
.goal .shout{opacity:1;transform:scale(1) rotate(-3deg);transition:transform .55s cubic-bezier(.3,1.9,.5,1),opacity .2s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}

/* paused cover: one button only */
.cover{position:absolute;inset:0;z-index:5;border:0;margin:0;width:100%;font:inherit;color:var(--white);cursor:pointer;
  background:rgba(8,14,40,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity .35s}
.playing .cover{opacity:0;pointer-events:none}
.play{width:124px;height:124px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 12px rgba(255,255,255,.22),0 16px 40px rgba(0,0,0,.5);animation:pulse 1.5s ease-in-out infinite}
.play svg{width:56px;height:56px;margin-left:9px}
.cover-label{font-weight:900;font-size:26px;text-shadow:0 3px 12px rgba(0,0,0,.6)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.cover:focus-visible .play{outline:4px solid var(--gold);outline-offset:6px}

/* details painted on the pitch */
.details{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding-block:0 calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.details-box{width:100%;max-width:360px;border:3px solid rgba(255,255,255,.92);border-radius:6px;background:rgba(8,56,28,.5);
  padding:16px 12px 18px;text-align:center;display:flex;flex-direction:column;gap:7px;color:var(--white);
  text-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0;transform:scale(.92);transition:opacity .5s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.details-box>*{margin:0;opacity:0;transform:translateY(16px);transition:opacity .45s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.final .details-box{opacity:1;transform:none}
.final .details-box>*{opacity:1;transform:none}
.final .details-box>:nth-child(1){transition-delay:.25s}
.final .details-box>:nth-child(2){transition-delay:.55s}
.final .details-box>:nth-child(3){transition-delay:.95s}
.final .details-box>:nth-child(4){transition-delay:1.35s}
.final .details-box>:nth-child(5){transition-delay:1.6s}
.details h1{font-weight:900;font-size:clamp(25px,7.6vw,32px);line-height:1.15;text-wrap:balance}
.details h1 b{color:var(--gold)}
.details .lead{font-size:15px;font-weight:600}
.details .big{font-weight:900;font-size:clamp(18px,5.4vw,21px);line-height:1.25}
.details .rule{height:3px;background:rgba(255,255,255,.92);border-radius:2px;margin:5px 22%}
.details .addr{font-weight:600;font-size:16px}
@media (prefers-reduced-motion:reduce){
  .play,.score .num.pop,.cap.pop,.goal .flash,.shake .scene{animation:none}
  .cover,.goal .shout,.details-box,.details-box>*{transition:none}
  .final .details-box>*{transition-delay:0s!important}
}
</style>

</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),world=$('world'),sandro=$('sandro'),sBody=$('sBody'),sHead=$('sHead'),ball=$('ball'),keeper=$('keeper'),
      legL=$('legL'),legR=$('legR'),armL=$('armL'),armR=$('armR'),net=$('goalNet'),crowd=$('crowd'),
      details=$('details'),kStand=$('kStand'),kDive=$('kDive'),num=$('num'),hud=$('hud'),cap=$('cap'),cover=$('cover'),fx=$('fx');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PI=Math.PI,sin=Math.sin,cos=Math.cos,abs=Math.abs;
  function clamp(v,a,b){return v<a?a:v>b?b:v}
  function seg(t,a,b){return clamp((t-a)/(b-a),0,1)}
  function ease(p){return p*p*(3-2*p)}
  function lerp(a,b,p){return a+(b-a)*p}
  function tf(el,s){el.setAttribute('transform',s)}

  /* timeline, seconds */
  var WP=[[0,200,1380],[0.9,200,1190],[1.5,112,1062],[2.2,140,905],[2.8,292,792],[3.5,250,648],[3.95,168,526],[4.5,195,452]];
  var T_WIND=4.5,T_KICK=4.75,T_GOAL=6.0,T_CEL=6.5,T_CARD=7.4,S_PLAY=.8,FX=200,FY=222;
  var DEF=[
    {el:$('d0'),st:$('st0'),x:195,y:1090,t:1.0,dir:1,dist:25,ph:0},
    {el:$('d1'),st:$('st1'),x:188,y:815,t:2.3,dir:-1,dist:18,ph:2},
    {el:$('d2'),st:$('st2'),x:250,y:560,t:3.62,dir:1,dist:26,ph:4,sit:true}
  ];
  var CAPS=[[1.45,'ერთი მოატყუა!'],[2.75,'მეორეც!'],[3.95,'მესამეც!!'],[4.6,'ურტყამს…'],[5.25,'მეკარე ხტება…']];
  var BALL_END=[279,166];

  var W=0,H=0,u=1,ox=0,oy=0,camY=0,cam=[1,0,0],SH={z:1,x:0,y:0},FIN=0,hudPx=120;
  function measure(){
    var d=Math.min(window.devicePixelRatio||1,2);
    W=stage.clientWidth;H=stage.clientHeight;
    u=Math.max(W/400,H/700);ox=(W-400*u)/2;oy=H-700*u;
    fx.width=W*d;fx.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    /* camera framings: the whole goal and keeper must sit in the visible area under the scoreboard */
    var visTop=700-H/u,visW=W/u;
    hudPx=hud.getBoundingClientRect().bottom-stage.getBoundingClientRect().top;
    var top=visTop+96/u+8,z=clamp(Math.min(visW/222,(700-top)/215),.75,1.6);
    SH={z:z,x:200-200*z,y:top-128*z};
    FIN=Math.max(0,visTop+hudPx/u+6-128);
  }
  function toScreen(x,y){return [ox+(x*cam[0]+cam[1])*u,oy+(y*cam[0]+cam[2])*u]}

  function path(t){
    if(t<=0)return [WP[0][1],WP[0][2]];
    for(var i=1;i<WP.length;i++){
      if(t<WP[i][0]){
        var a=WP[i-1],b=WP[i],p=seg(t,a[0],b[0]);p=p*.45+ease(p)*.55;
        return [lerp(a[1],b[1],p),lerp(a[2],b[2],p)];
      }
    }
    var l=WP[WP.length-1];return [l[1],l[2]];
  }

  var cel=null;
  function celebratePos(){
    var feetPx=H-details.offsetHeight-14;
    var s=clamp((feetPx-hudPx-26)/(200*u),.5,1);
    return [200,(feetPx-oy)/u-FIN,s];
  }

  function render(t){
    var ph=t*16,pos=path(t),sx=pos[0],sy=pos[1],sc=S_PLAY,flip=1,lean=0;
    var running=t>0&&t<T_WIND;
    if(running){var a=path(t-.04),b=path(t+.04);lean=clamp((b[0]-a[0])/.08*.06,-17,17)}
    if(t>3.5&&t<3.95)flip=cos(2*PI*seg(t,3.5,3.95));
    var after=t>=T_GOAL;
    if(t>=T_CEL){
      if(!cel)cel=celebratePos();
      var p=ease(seg(t,T_CEL,T_CEL+.9));
      sx=lerp(sx,cel[0],p);sy=lerp(sy,cel[1],p);sc=lerp(S_PLAY,cel[2],p);
    }
    camY=clamp(560-sy,-820,0);
    var ps=ease(seg(t,T_WIND-.3,T_KICK+.35)),pf=ease(seg(t,T_CEL,T_CEL+.8));
    var cz=lerp(lerp(1,SH.z,ps),1,pf),cx_=lerp(lerp(0,SH.x,ps),0,pf),cy_=lerp(lerp(camY,SH.y,ps),FIN,pf);
    cam=[cz,cx_,cy_];
    tf(world,'translate('+cx_.toFixed(1)+','+cy_.toFixed(1)+') scale('+cz.toFixed(3)+')');

    /* Sandro pose */
    var lL,lR,aL,aR,bob=0,kL=1,kR=1,tilt=0;
    if(after){
      var j=reduce?0:abs(sin(t*7));bob=-20*j;
      aL=150+14*sin(t*11);aR=-150-14*sin(t*11+1);lL=-8*j;lR=8*j;kL=kR=1-.12*j;tilt=reduce?0:6*sin(t*5.5);
    }else if(t>=T_WIND){
      var w=seg(t,T_WIND,T_KICK),k=seg(t,T_KICK,T_KICK+.14),r=seg(t,T_KICK+.14,T_KICK+.5);
      lR=lerp(lerp(0,36,ease(w)),-72,ease(k));lR=lerp(lR,0,ease(r));lL=0;
      aL=lerp(12,70,ease(w));aR=lerp(-12,-60,ease(w));lean=lerp(-8*ease(w),10,ease(k))*(1-r);bob=0;
    }else{
      var m=running?1:.0;
      kL=1-.4*Math.max(0,sin(ph))*m;kR=1-.4*Math.max(0,sin(ph+PI))*m;
      lL=7*sin(ph)*m;lR=7*sin(ph+PI)*m;
      aL=12+42*sin(ph+PI)*m;aR=-12-42*sin(ph)*m;
      bob=-6*abs(sin(ph))*m;tilt=4*sin(ph*.5)*m;
    }
    tf(sandro,'translate('+sx.toFixed(1)+','+sy.toFixed(1)+') scale('+(sc*flip).toFixed(3)+','+sc.toFixed(3)+')');
    tf(sBody,'translate(0,'+bob.toFixed(1)+') rotate('+lean.toFixed(1)+')');
    tf(sHead,'rotate('+(tilt-lean*.5).toFixed(1)+' 0 -124)');
    tf(legL,'rotate('+lL.toFixed(1)+') scale(1,'+kL.toFixed(3)+')');
    tf(legR,'rotate('+lR.toFixed(1)+') scale(1,'+kR.toFixed(3)+')');
    tf(armL,'rotate('+aL.toFixed(1)+')');tf(armR,'rotate('+aR.toFixed(1)+')');

    /* ball */
    var kp=path(T_WIND),bx,by,bs=S_PLAY,br=t*620;
    if(t<T_WIND){bx=sx+13*sin(ph*.5)+lean*.7;by=sy-18+4*cos(ph)}
    else if(t<T_KICK){bx=kp[0]+15;by=kp[1]-14}
    else if(t<T_GOAL){
      var q=1-Math.pow(1-seg(t,T_KICK,T_GOAL),1.7),x0=kp[0]+15,y0=kp[1]-14,cx=324,cy=330;
      bx=(1-q)*(1-q)*x0+2*(1-q)*q*cx+q*q*BALL_END[0];
      by=(1-q)*(1-q)*y0+2*(1-q)*q*cy+q*q*BALL_END[1];
      bs=lerp(S_PLAY,.55,q);br=t*1100;
      if(!reduce)trail(bx,by);
    }else{
      var d=seg(t,T_GOAL,T_GOAL+.6),bounce=d<.6?ease(d/.6):1-.12*sin((d-.6)/.4*PI);
      bx=BALL_END[0]-5*d;by=lerp(BALL_END[1],250,bounce);bs=.55;br=0;
    }
    tf(ball,'translate('+bx.toFixed(1)+','+by.toFixed(1)+') scale('+bs.toFixed(3)+') rotate('+br.toFixed(0)+')');

    /* defenders */
    for(var i=0;i<DEF.length;i++){
      var D=DEF[i],x,y,rot=0,fx_=1,fy=1,showStars=false,hx,hy;
      if(t<D.t){x=D.x+(t>0?9*sin(t*7+D.ph):0);y=D.y-(t>0?3*abs(sin(t*9+D.ph)):0)}
      else{
        var p2=seg(t,D.t,D.t+.5),e=1-(1-p2)*(1-p2);
        x=D.x+D.dir*D.dist*e;y=D.y+18*e;
        if(D.sit){fx_=p2<1?cos(p2*5*PI):1;fy=lerp(1,.62,e);rot=p2<1?0:5*sin(t*4)}
        else rot=D.dir*82*e;
        showStars=p2>=1;
        if(!D.done){D.done=true;if(!reduce)dust(x,y)}
      }
      tf(D.el,'translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+rot.toFixed(1)+') scale('+(.85*fx_).toFixed(3)+','+(.85*fy).toFixed(3)+')');
      var fade=1-seg(t,T_GOAL+.3,T_GOAL+.9);
      D.el.setAttribute('opacity',fade);D.st.setAttribute('opacity',showStars?fade:0);
      if(showStars){
        var L=134*.85*fy,ra=rot*PI/180;hx=x+L*sin(ra);hy=y-L*cos(ra)-16;
        var ts=D.st.children;
        for(var s=0;s<3;s++){var an=(reduce?0:t*5)+s*2.094;ts[s].setAttribute('x',(hx+24*cos(an)).toFixed(1));ts[s].setAttribute('y',(hy+8*sin(an)+6).toFixed(1))}
      }
    }

    /* keeper: dives the right way and still misses it */
    var kw=ease(seg(t,T_WIND,T_KICK+.3)),kd=ease(seg(t,T_KICK+.38,T_KICK+1.08)),kl=ease(seg(t,T_GOAL+.1,T_GOAL+.6));
    var kx=lerp(200+(t>0&&t<T_WIND?12*sin(t*4):0),lerp(178,192,kl),kd),ky=lerp(262,lerp(252,262,kl),kd);
    var krot=lerp(50*kd,86,kl),ksy=1.5*(1-.1*kw*(1-kd));
    tf(keeper,'translate('+kx.toFixed(1)+','+ky.toFixed(1)+') rotate('+krot.toFixed(1)+') scale(1.5,'+ksy.toFixed(3)+')');
    kStand.setAttribute('opacity',kd<.2?1:0);kDive.setAttribute('opacity',kd<.2?0:1);

    /* net and crowd */
    var nb=after?seg(t,T_GOAL,T_GOAL+.5):0,nv=nb>0&&nb<1?sin(nb*PI*3)*(1-nb):0;
    tf(net,'translate('+(8*nv).toFixed(1)+','+(-6*nv).toFixed(1)+')');
    tf(crowd,'translate(0,'+(after&&!reduce?(-4*abs(sin(t*10))).toFixed(1):0)+')');
  }

  /* particles */
  var ctx=fx.getContext('2d'),parts=[],COLORS=['#FFFFFF','#E0152A','#FFC93C','#FF6B7A'];
  function add(x,y,vx,vy,c,d,w){parts.push({x:x,y:y,vx:vx,vy:vy,life:1,d:d,c:c,w:w||2.4})}
  function trail(wx,wy){
    var s=toScreen(wx,wy);
    for(var i=0;i<4;i++)add(s[0]+(Math.random()-.5)*8,s[1]+(Math.random()-.5)*8,(Math.random()-.5)*1.4,Math.random()*1.6,i%2?'#FFC93C':'#FF6B2A',.05,3.5);
  }
  function dust(wx,wy){
    var s=toScreen(wx,wy);
    for(var i=0;i<14;i++){var a=PI+Math.random()*PI,v=1+Math.random()*2.4;add(s[0],s[1],cos(a)*v,sin(a)*v*.7,'#E9F5EC',.035,4)}
  }
  function burst(){
    var x=W*(.12+Math.random()*.76),y=H*(.06+Math.random()*.32),c=COLORS[Math.floor(Math.random()*COLORS.length)],n=34+Math.floor(Math.random()*18);
    for(var i=0;i<n;i++){var a=PI*2*i/n+Math.random()*.2,v=1.6+Math.random()*3.2;add(x,y,cos(a)*v,sin(a)*v,Math.random()<.25?'#FFFFFF':c,.012+Math.random()*.012)}
  }
  function confetti(){
    for(var i=0;i<70;i++)add(Math.random()*W,-10-Math.random()*60,(Math.random()-.5)*2,1.5+Math.random()*2.5,COLORS[i%4],.006,5);
  }
  function drawParts(){
    ctx.clearRect(0,0,W,H);ctx.lineCap='round';
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.life-=p.d;
      if(p.life<=0||p.y>H+20){parts.splice(i,1);continue}
      ctx.globalAlpha=p.life;ctx.strokeStyle=p.c;ctx.lineWidth=p.w;
      ctx.beginPath();ctx.moveTo(p.x-p.vx*2,p.y-p.vy*2);ctx.lineTo(p.x,p.y);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  /* run loop */
  var state='cover',t0=0,raf=0,capI=0,goalDone=false,cardDone=false,nextBurst=0;
  function setCap(s){cap.textContent=s;cap.classList.remove('pop');void cap.offsetWidth;cap.classList.add('pop')}
  function onGoal(){
    goalDone=true;cap.textContent='';
    stage.classList.add('goal','shake');num.textContent='5';num.classList.add('pop');
    if(!reduce){confetti();burst();burst()}
  }
  function frame(now){
    var t=(now-t0)/1000;
    while(capI<CAPS.length&&t>=CAPS[capI][0]){if(t<T_GOAL)setCap(CAPS[capI][1]);capI++}
    if(!goalDone&&t>=T_GOAL)onGoal();
    if(!cardDone&&t>=T_CARD){cardDone=true;stage.classList.add('final')}
    render(t);
    if(goalDone&&now>nextBurst){burst();nextBurst=now+(t<T_GOAL+5?330:1300+Math.random()*900)}
    drawParts();
    raf=requestAnimationFrame(frame);
  }
  function play(){
    state='playing';stage.classList.add('playing');
    if(reduce){cel=null;onGoal();stage.classList.add('final');render(T_CARD+2);return}
    t0=performance.now();raf=requestAnimationFrame(frame);
  }
  cover.addEventListener('click',function(){if(state==='cover')play()});
  window.addEventListener('resize',function(){measure();if(cel)cel=celebratePos();if(state==='cover')render(0);else if(reduce)render(T_CARD+2)});
  measure();render(0);
})();
</script>
</body>
</html>
